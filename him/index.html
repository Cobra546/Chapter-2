<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz History</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{font-size:1.35rem;margin:0}.top button{border:0;border-radius:12px;padding:11px 14px;background:#fff;color:#111;font-weight:700;cursor:pointer}.status{opacity:.7;margin:0 0 18px}.attempt{border:1px solid #29292e;border-radius:18px;background:#151518;padding:16px;margin:14px 0}.attempt h2{font-size:1rem;margin:0 0 4px}.time{font-size:.78rem;opacity:.55;margin-bottom:12px}.line{padding:11px 0;border-top:1px solid #28282d}.line:first-of-type{border-top:0}.q{font-weight:700;margin-bottom:5px}.answer{color:#ffb7c5}.empty{text-align:center;opacity:.65;padding:40px 10px}</style></head><body><main><section id="app"><div class="top"><h1>❤️ Quiz History</h1><button id="refresh">Refresh</button></div><p id="status" class="status">Loading...</p><div id="history"></div></section></main><script src="../js/supabase.js"></script><script>const client=typeof supabaseClient!=='undefined'?supabaseClient:null;const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const status=document.getElementById('status'),box=document.getElementById('history');status.textContent='Loading quiz attempts...';box.innerHTML='';if(!client){status.textContent='Supabase connection unavailable.';return}const{data,error}=await client.from('quiz_answers').select('question_number,question,selected_option,session_id,attempt_number,created_at').order('created_at',{ascending:true}).order('id',{ascending:true});if(error){status.textContent='Could not load quiz history.';console.error(error);return}if(!data?.length){status.textContent='No quiz answers recorded yet.';box.innerHTML='<div class="empty">No answers yet ❤️</div>';return}const groups=new Map();data.forEach(row=>{const key=row.session_id||`legacy-${row.created_at}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)});const attempts=[...groups.values()].reverse();status.textContent=`${attempts.length} attempt${attempts.length===1?'':'s'} recorded`;attempts.forEach((rows,i)=>{rows.sort((a,b)=>a.question_number-b.question_number||new Date(a.created_at)-new Date(b.created_at));const attempt=rows[0].attempt_number||attempts.length-i,start=new Date(rows[0].created_at).toLocaleString(),card=document.createElement('section');card.className='attempt';card.innerHTML=`<h2>Attempt ${esc(attempt)}</h2><div class="time">Started: ${esc(start)}</div>`;rows.forEach((r,n)=>{const line=document.createElement('div');line.className='line';line.innerHTML=`<div class="q">${n+1}. ${esc(r.question)}</div><div class="answer">Selected: ${esc(r.selected_option)}</div>`;card.appendChild(line)});box.appendChild(card)})}document.getElementById('refresh').addEventListener('click',load);load();</script></body></html>
