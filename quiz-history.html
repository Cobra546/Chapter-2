<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz History — Our Story ❤️</title><style>:root{--bg:#05060A;--bg2:#0F1118;--primary:#FF4D8D;--secondary:#FF82B2;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--bg),var(--bg2));color:#fff;font-family:Poppins,Arial,sans-serif}body{padding:24px}.wrap{width:min(680px,100%);margin:0 auto}.head{text-align:center;margin:18px 0 26px}.head .icon{font-size:48px}.head h1{margin:8px 0;font-size:30px}.head p{color:#ccc}.card{background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:20px;margin:14px 0;backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.28)}.attempt{display:flex;justify-content:space-between;gap:14px;align-items:center}.attempt h2{font-size:19px;margin:0 0 7px}.meta{color:#aaa;font-size:13px}.score{font-weight:700;color:#ffb7d0;white-space:nowrap}.empty,.error{text-align:center;color:#ccc;padding:30px 10px}.error{color:#ffb0b0}.back{display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;cursor:pointer}</style></head><body><main class="wrap"><header class="head"><div class="icon">📖</div><h1>Quiz History ❤️</h1><p>Every little quiz attempt becomes part of our story.</p></header><section id="history"></section><button class="back" onclick="location.href='index.html'">❤️ Back to Our Story</button></main><script src="js/quiz-history.js"></script><script>async function loadHistory(){const box=document.getElementById("history");box.innerHTML='<div class="card empty">Loading history... ❤️</div>';try{const r=await fetch(`${QUIZ_SUPABASE_URL}/rest/v1/${QUIZ_TABLE}?select=session_id,attempt_number,created_at&order=created_at.desc`,{headers:getQuizHeaders()});if(!r.ok)throw new Error(await r.text());const rows=await r.json();const groups=new Map();rows.forEach(x=>{const key=x.session_id||`legacy-${x.attempt_number||x.created_at}`;if(!groups.has(key))groups.set(key,{attempt:x.attempt_number||0,date:x.created_at})});const items=[...groups.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));if(!items.length){box.innerHTML='<div class="card empty">No quiz attempts yet. Take the quiz and your history will appear here. ❤️</div>';return}box.innerHTML=items.map((x,i)=>`<article class="card attempt"><div><h2>Quiz Attempt ${x.attempt||items.length-i}</h2><div class="meta">${new Date(x.date).toLocaleString()}</div></div><div class="score">8 / 8 ❤️</div></article>`).join("")}catch(e){console.error(e);box.innerHTML='<div class="card error">Could not load quiz history right now. Please try again. ❤️</div>'}}loadHistory();</script></body></html>
